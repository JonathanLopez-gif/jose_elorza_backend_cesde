services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - joselorza_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - joselorza_network

  maildev:
    image: maildev/maildev
    container_name: maildev          # Debe coincidir con MAIL_HOST=maildev del .env
    ports:
      - "1080:1080"
      - "1025:1025"
    restart: unless-stopped
    networks:
      - joselorza_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: joselorza_app:latest
    container_name: app
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL_DOCKER}       # Se traduce para que application.yml lo capture
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      maildev:
        condition: service_started
    networks:
      - joselorza_network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:

networks:
  joselorza_network:
    driver: bridge